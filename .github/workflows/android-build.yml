name: Build NeonArcade APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract NeonArcade project
        run: |
          rm -rf project
          mkdir project
          unzip -q NeonArcade_Android_Project.zip -d project

      - name: Build NeonArcade
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload NeonArcade APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonArcade-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
