name: Build NeonArcade APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract NeonArcade project
        run: |
          mkdir project
          unzip -q NeonArcade_Android_Project.zip -d project

      - name: Find Android project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          chmod +x "$GRADLEW"

      - name: Build NeonArcade APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonArcade-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
